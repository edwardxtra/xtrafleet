# Production Environment - Firebase App Hosting Configuration
# https://firebase.google.com/docs/app-hosting/configure
# See apphosting.qa.yaml for QA environment configuration

runConfig:
  # Raised from 1 (DEV: failed production rollouts, Aug 2026).
  #
  # With a cap of 1, the revision currently serving live traffic holds the
  # only instance, so a new revision has nowhere to start and fails its
  # startup probe — Cloud Run reports "container failed to start and listen
  # on the port" and then "Resource readiness deadline exceeded", even though
  # the build itself succeeded and the image published fine.
  #
  # This matches every symptom: builds pass, deploys fail, QA (which has
  # almost no traffic, so its instance scales to zero between rollouts)
  # deploys the identical commit without trouble.
  #
  # maxInstances is only a ceiling — with minInstances unset the backend
  # still scales to zero, so this adds deploy headroom without adding
  # idle cost.
  maxInstances: 4

env:
  - variable: NEXT_PUBLIC_APP_URL
    value: https://xtrafleet.com

  # Firebase Admin SDK - Individual variables
  - variable: FB_PROJECT_ID
    value: studio-5112915880-e9ca2
  - variable: FB_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@studio-5112915880-e9ca2.iam.gserviceaccount.com
  - variable: FB_PRIVATE_KEY
    secret: FB_PRIVATE_KEY

  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY

  # Stripe Configuration
